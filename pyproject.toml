[project]
name = "contact-damped-wave"
version = "0.1.0"
description = "Reproduction of the numerical examples in arXiv:2412.06185 (inelastic contact problem for the damped wave equation)"
readme = "README.md"
authors = [
    { name = "wakabame", email = "yuki@deltaex.co.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
]

[project.scripts]
cdw = "contact_damped_wave.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
